server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La tienda es una SPA: /producto/item_101, /pedidos o /callback no son
    # archivos en disco. Sin este fallback, la vuelta de Webpay (redirect de
    # ms-pago a /callback) o recargar cualquier ruta darían 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html tampoco se cachea: es el que apunta a los assets con hash del
    # deploy vigente. Si quedara en caché, el navegador pediría assets viejos.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # config.js lo genera el entrypoint en cada arranque: si se cachea, un
    # cambio de entorno (local → AWS) no toma efecto hasta un refresco forzado.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Los assets compilados llevan hash en el nombre: son inmutables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # El mapa de ruta se abre en un iframe del mismo origen (postMessage
    # verifica el origen); se sirve tal cual desde public/.
    location = /ruta-paquete.html {
        add_header Cache-Control "no-cache";
    }

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sin proxy_pass: el navegador llama a los microservicios (o a API Gateway)
    # directamente y el CORS se declara del lado de los servicios. Fue la
    # observación del docente en la EV2: "no usar Proxy en backend".
}
