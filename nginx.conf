server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La tienda es una sola pagina: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js se genera en cada arranque: nunca debe quedar en cache.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Antes de que React monte, el navegador ve el template crudo y pide
    # <iframe src="{{ routeSrc }}">. Sin esto, el fallback devolveria index.html
    # y cargaria la tienda entera dentro de un iframe oculto.
    location ~ "\{\{" {
        access_log off;
        return 204;
    }

    location = /salud {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Sin proxy_pass: el navegador llama a los microservicios (o a API Gateway)
    # directamente y el CORS se declara del lado de los servicios.
}
